<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 서논술형 채점</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f5bea' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 11l3 3L22 4'/%3E%3Cpath d='M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap">
<script>
  // 새 판을 올리면 바로 받도록: version.json 은 매번 새로 읽고, 나머지 파일에는 판 번호를 붙인다
  window.APP_READY = (async () => {
    let v = String(Date.now());
    try { v = (await (await fetch('version.json', { cache: 'no-store' })).json()).v || v; } catch (e) {}
    window.APP_VERSION = v;
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'app.css?v=' + v; document.head.appendChild(css);
    return v;
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<header id="top">
  <a class="brand" href="#/">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    AI 서논술형 채점
  </a>
  <div class="crumb" id="crumb"></div>
  <button class="btn sm ghost" data-act="help" title="도움말 (?)">? 도움말</button>
  <button class="btn sm ghost" data-act="theme" title="밝게/어둡게">◐</button>
  <button class="btn sm" data-act="settings"><span id="keydot"></span> 설정</button>
</header>
<main id="view"></main>
<div id="modal" class="hide"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<script>
  window.APP_READY.then(async v => {
    for (const f of ['parse.js', 'ai.js', 'app.js']) {
      await new Promise(res => { const e = document.createElement('script'); e.src = f + '?v=' + v; e.onload = e.onerror = res; document.body.appendChild(e); });
    }
  });
</script>
</body>
</html>
