<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 서논술형 채점</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236E56CF' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 11l3 3L22 4'/%3E%3Cpath d='M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;700&display=swap">
<script>
  // 새 판을 올리면 바로 받도록: version.json 은 매번 새로 읽고, 나머지 파일에는 판 번호를 붙인다
  window.APP_READY = (async () => {
    let v = String(Date.now());
    try { v = (await (await fetch('version.json', { cache: 'no-store' })).json()).v || v; } catch (e) {}
    window.APP_VERSION = v;
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'app.css?v=' + v; document.head.appendChild(css);
    return v;
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header id="top">
      <button class="hbtn q" data-act="sidetoggle" title="메뉴 접기/펴기" id="sidet"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <span class="navbtns">
        <button class="hbtn q" data-act="navback" title="뒤로 (Alt+←)"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="hbtn q" data-act="navfwd" title="앞으로 (Alt+→)"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="hbtn q" data-act="undo" id="undob" disabled title="되돌릴 것이 없어요"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button class="hbtn q" data-act="redo" id="redob" disabled title="다시 할 것이 없어요"><svg class="ic" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      </span>
      <div id="scope"></div>
      <span id="saved"></span>
      <button class="hbtn q" data-act="help" title="도움말 (?)"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></button>
      <button class="hbtn q" data-act="theme" title="밝게/어둡게" id="themebtn"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="lb hide" id="themelb"></span></button>
      <button class="hbtn hide" data-act="quotahelp" id="quota" title="오늘 AI 사용량"></button>
      <button class="hbtn gs hide" data-act="gsync" id="gsync" title="구글 드라이브 저장"></button>
      <button class="hbtn q" data-act="settings" title="설정"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span id="keydot"></span></button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="mback" data-act="sheetclose"></div>
<div id="modal" class="hide"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<script>
  window.APP_READY.then(async v => {
    for (const f of ['parse.js', 'ai.js', 'sync.js', 'app.js']) {
      await new Promise(res => { const e = document.createElement('script'); e.src = f + '?v=' + v; e.onload = e.onerror = res; document.body.appendChild(e); });
    }
  });
</script>
</body>
</html>
